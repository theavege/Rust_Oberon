---
name: Make

on:
  schedule:
    - cron: '0 0 1 * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build
        shell: bash
        run: |
          set -xeuo pipefail
          cargo fmt --check --all
          cargo clippy
          cargo build --release
